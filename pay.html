<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shop & Pay | ElectroStock</title><style>
body{margin:0;background:#101827;color:#eef3f9;font:16px system-ui;line-height:1.5}.wrap{max-width:850px;margin:auto;padding:24px 16px}.card{background:#1a2638;border:1px solid #344256;border-radius:16px;padding:20px;margin:14px 0}.muted{color:#a9b7c9}h1{margin:0 0 8px}button{background:#c9a84c;color:#17251e;border:0;border-radius:9px;padding:12px;font-weight:700;cursor:pointer}button:disabled{opacity:.6}.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.product{padding:12px;border:1px solid #39475b;border-radius:12px}.price{font-weight:800;color:#e4ce8c}.qty,input{padding:10px;border-radius:8px;border:1px solid #46566d;background:#111d2d;color:white}label{display:block;margin:12px 0}.full{width:100%}.hidden{display:none}.msg{padding:12px;border-radius:9px;background:#173d31;margin:12px 0}.bad{background:#4a2028}
</style></head><body><main class="wrap"><div class="muted">E+ · ElectroStock secure checkout</div><section class="card"><h1 id="shop">Loading shop…</h1><p id="intro" class="muted">Choose items and pay securely through Paystack.</p><div id="msg" class="msg hidden"></div></section><section id="catalog" class="card hidden"><h2>Available products</h2><div id="products" class="products"></div><h2>Total: <span id="total">₦0</span></h2><form id="form"><label>Name (optional)<input id="name" maxlength="120"></label><label>Email for receipt<input id="email" type="email" required></label><button class="full" id="pay">Continue to Paystack</button></form></section><section id="result" class="card hidden"><h2 id="resultTitle">Payment status</h2><p id="resultText"></p><button id="retry" class="hidden">Check payment again</button></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>
(()=>{const $=id=>document.getElementById(id),q=new URLSearchParams(location.search),shopId=q.get("shop"),ref=q.get("reference");let db,shop={},items=[],qty={};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const cash=n=>new Intl.NumberFormat("en-NG",{style:"currency",currency:shop.currency||"NGN"}).format(n||0);
function msg(s,bad=false){$("msg").textContent=s;$("msg").classList.remove("hidden");$("msg").classList.toggle("bad",bad);}
function sum(){return items.reduce((n,p)=>n+(+qty[p.id]||0)*(+p.selling_price||0),0)}
function render(){ $("products").innerHTML=items.map(p=>'<div class="product"><strong>'+esc(p.name)+'</strong><div class="muted">'+esc([p.brand,p.model].filter(Boolean).join(" · "))+'</div><p class="price">'+cash(p.selling_price)+'</p><label>Quantity <select class="qty" data-id="'+p.id+'">'+Array.from({length:Math.min(9,+p.quantity)+1},(_,n)=>'<option '+((+qty[p.id]||0)===n?'selected':'')+'>'+n+'</option>').join("")+'</select> <small class="muted">'+p.quantity+' in stock</small></label></div>').join("");$("products").querySelectorAll("[data-id]").forEach(x=>x.onchange=()=>{qty[x.dataset.id]=+x.value;total()});total();}
function total(){$("total").textContent=cash(sum());$("pay").disabled=!items.some(p=>+qty[p.id]>0)}
async function verify(){ $("catalog").classList.add("hidden");$("result").classList.remove("hidden");$("resultTitle").textContent="Verifying payment…";$("resultText").textContent="Checking with Paystack.";const b=$("retry");b.classList.remove("hidden");b.disabled=true;try{const {data,error}=await db.functions.invoke("scan-pay-verify",{body:{reference:ref}});if(error||!data?.success){$("resultTitle").textContent=data?.paid?"Payment received — contact shop":"Payment not confirmed";$("resultText").textContent=data?.error||data?.message||error?.message||"Check again shortly; do not pay twice.";return}$("resultTitle").textContent="Payment successful";$("resultText").textContent="Payment confirmed. Reference: "+ref;b.classList.add("hidden")}catch{$("resultText").textContent="Verification unavailable. Keep your reference and check again."}finally{b.disabled=false}}
$("retry").onclick=verify;
(async()=>{if(!window.supabase||!window.ELECTROSTOCK_CONFIG?.supabaseUrl){$("shop").textContent="Shop unavailable";msg("App configuration missing.",true);return}db=window.supabase.createClient(window.ELECTROSTOCK_CONFIG.supabaseUrl,window.ELECTROSTOCK_CONFIG.supabaseAnonKey);if(ref){await verify();return}if(!shopId){$("shop").textContent="Invalid shop link";return}const {data,error}=await db.functions.invoke("scan-pay-shop",{body:{owner_id:shopId}});if(error||!data?.shop){$("shop").textContent="Shop unavailable";msg(data?.error||error?.message||"Shop not enabled for Scan & Pay.",true);return}shop=data.shop;items=data.products||[];$("shop").textContent=shop.company_name||"ElectroStock shop";$("intro").textContent="Choose products and continue to secure Paystack checkout.";$("catalog").classList.remove("hidden");render()})();
$("form").onsubmit=async e=>{e.preventDefault();const chosen=items.filter(p=>+qty[p.id]>0).map(p=>({product_id:p.id,quantity:+qty[p.id]}));if(!chosen.length)return;const b=$("pay");b.disabled=true;b.textContent="Opening checkout…";try{const {data,error}=await db.functions.invoke("scan-pay-create",{body:{owner_id:shopId,customer_email:$("email").value.trim(),customer_name:$("name").value.trim(),items:chosen}});if(error||!data?.authorization_url){msg(data?.error||error?.message||"Checkout could not start.",true);return}window.location.assign(data.authorization_url)}catch(e){msg(e?.message||"Checkout could not start.",true)}finally{b.disabled=false;b.textContent="Continue to Paystack"}};
})();
</script></body></html>
